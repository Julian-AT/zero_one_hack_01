# Default training hyperparameters; per-cell overrides in arch configs.
train:
  batch_size: 32
  grad_accum: 1
  max_steps: 6000              # ~7 epochs at 10k seqs/family / bs=32
  warmup_steps: 200
  lr: 3.0e-4                   # AdamW
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: bf16              # A100 native
  log_every: 25
  eval_every: 500
  save_every: 2000
  seed: 42
  family_dropout: 0.2          # OOD discipline
  max_len: 256                 # sequence length

# Online generator settings — Stage 1 of the chain
data:
  use_online_generator: true
  families: [mosfet, igbt, ic]
  corrupt_fraction: 0.25       # 25% of training samples get a rule-violation injected
  canonicalize: false          # set true to fold synonyms during training (loses signal for Task 2 EM)
  num_workers: 2

# Multi-task loss weights — Stage 1 of the chain (LM only tonight, multi-task tomorrow)
loss:
  lm_weight: 1.0
  validity_weight: 0.0         # turn on (0.5) once heads are wired
  rule_id_weight: 0.0          # turn on (0.3) once heads are wired

# Tracking
tracking:
  tensorboard_dir: extras/logs/tb
  wandb_project: zero-one-process-logic
  wandb_entity: null           # set via env WANDB_ENTITY if needed
  wandb_mode: opportunistic    # one of: opportunistic | online | offline | disabled

# Output
out:
  checkpoint_dir: extras/checkpoints
