# xLSTM mixed-block ~5M params (NX-AI/xlstm)
arch: xlstm
model:
  d_model: 256
  num_blocks: 4
  block_pattern: [mlstm, slstm, mlstm, slstm]
  dropout: 0.1
  max_seq_len: 256
  mlstm:
    num_heads: 4
    conv1d_kernel_size: 4
    qkv_proj_blocksize: 4
  slstm:
    num_heads: 4
    conv1d_kernel_size: 4
    backend: cuda
