name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pure-logic test suite and lint config are torch-free, so CI installs
      # only the lightweight toolchain. The full ML environment lives in pixi.
      - name: Install tooling
        run: pip install ruff==0.15.15 pytest==9.0.2

      - name: Test
        run: pytest
