[workspace]
name = "process-logic"
version = "0.1.0"
description = "Zero One Hack_01 — Industrial AI (Infineon) track. Process-sequence modeling."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# Tell pixi the target system has CUDA 12 available so the resolver can pick
# CUDA builds of pytorch-gpu when installing from a non-GPU login node.
[system-requirements]
cuda = "12"

# Make the `transformer_xlstm` package (under models/) importable for the
# `python -m transformer_xlstm.…` tasks and interactive shells, mirroring
# pytest's pythonpath=["models"]. The package moved from repo root to
# models/transformer_xlstm during the approaches/ restructure.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/models"

[tasks]
# Verify install (prints torch version + CUDA availability)
smoke = "python -c 'import torch; print(torch.__version__, torch.cuda.is_available())'"

# Build tokenizers
tokenize-step = "python -m transformer_xlstm.data.tokenizer --mode step"
tokenize-comp = "python -m transformer_xlstm.data.tokenizer --mode compositional"

# Data smoke test
data-smoke = "python -m transformer_xlstm.data.load"

# Trigram baseline
trigram = "python shared/extras/baselines/trigram_baseline.py"

# Launch single training run
train = "python -m transformer_xlstm.train.launch --arch-config configs/arch/transformer_small.yaml --train-config configs/train/default.yaml --token-config configs/token/compositional.yaml --run-name dev-run"

# Lint / format / test
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest"

[dependencies]
python = ">=3.10,<3.13"
pandas = ">=2.2"          # pulls in a compatible numpy automatically
pyyaml = ">=6.0"
tqdm = ">=4.66"
rich = ">=13.7"

[pypi-dependencies]
# Cross-platform pure-Python deps
einops = ">=0.7"
omegaconf = ">=2.3"
tensorboard = ">=2.16"

# --- Linux (Leonardo Booster: A100, driver 535.x => CUDA 12.2 ceiling) -------
# Torch comes from conda-forge `pytorch-gpu` (not PyPI): the PyPI wheels were
# resolving to cu130, which fails on Leonardo's driver. The conda metapackage
# pulls a torch built against a compatible CUDA runtime. Keep libstdcxx-ng here
# so the env ships a modern GLIBCXX instead of falling back to the system one.
[target.linux-64.dependencies]
libstdcxx-ng = ">=13"
pytorch-gpu = ">=2.4,<2.6"

# Pixi doesn't always export LD_LIBRARY_PATH from conda activation scripts, so
# set it explicitly to prefer the env's libstdc++ at runtime.
[target.linux-64.activation.env]
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib"

[target.linux-64.pypi-dependencies]
xlstm = ">=1.0.7"
wandb = ">=0.17"

# --- macOS dev (Apple Silicon): default wheels (CPU/MPS), no CUDA, no xlstm ---
[target.osx-arm64.pypi-dependencies]
torch = ">=2.4,<2.6"
wandb = ">=0.17"

# Optional visualization deps (EDA + result plots). Install with:
#   pixi add --feature viz matplotlib seaborn   (or `pip install -e .[viz]`)
[feature.viz.dependencies]
matplotlib = ">=3.8"
seaborn = ">=0.13"

[environments]
viz = ["viz"]
