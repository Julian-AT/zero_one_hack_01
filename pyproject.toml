[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process-logic"
version = "0.1.0"
description = "Zero One Hack_01 — Industrial AI track. Learning and benchmarking semiconductor process-logic sequences."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
